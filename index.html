table{

th{

th,td{

.bullet{

.button-container{

.button{

    text-decoration:none;

    font-weight:600;
}

.button:hover{
    opacity:.9;
}

.footer{
    margin-top:15px;
    text-align:center;
    font-size:12px;
    color:#666;
}

@media(max-width:768px){

    .header h1{
        font-size:24px;
    }

    table{
        font-size:12px;
    }

}

</style>

function colore(valore){

    if(!valore) return "#4caf50";

    valore = valore.toLowerCase();

    if(valore === "rosso")
        return "#d32f2f";

    if(valore === "arancione")
        return "#ef6c00";

    if(valore === "giallo")
        return "#fbc02d";

    return "#4caf50";
}

function salvaStorico(coloreOggi){

    const data = new Date().toISOString().substring(0,10);

    localStorage.setItem(
        "allertaMilano",
        JSON.stringify({
            data:data,
            colore:coloreOggi
        })
    );
}

function recuperaIeri(){
