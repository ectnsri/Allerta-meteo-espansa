<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Allerta Protezione Civile Milano</title>

<style>

html,body{
    margin:0;
    padding:0;
    font-family:Segoe UI,Arial,sans-serif;
    background:#ffffff;
}

.widget{
    width:100%;
    max-width:850px;
    margin:auto;
    background:black;
    border:1px solid #d9d9d9;
    border-radius:12px;
    padding:16px;
    box-sizing:border-box;
}

.titolo{
    text-align:center;
    font-size:24px;
    font-weight:700;
    margin-bottom:4px;
}

.sottotitolo{
    text-align:center;
    color:#666;
    font-size:12px;
    margin-bottom:15px;
}

.tabella{
    display:grid;
    grid-template-columns:220px 1fr 1fr 1fr;
    gap:8px;
    align-items:center;
}

.header{
    text-align:center;
    font-weight:700;
    padding:8px;
}

.riga{
    font-weight:600;
}

.cella{
    text-align:center;
    padding:10px;
    border-radius:8px;
    color:white;
    font-weight:700;
}

.footer{
    margin-top:16px;
    border-top:1px solid #eee;
    padding-top:10px;
    text-align:center;
    font-size:11px;
    color:#666;
}

.aggiornamento{
    margin-top:6px;
}

</style>

</head>

<body>

<div class="widget">

    <div class="titolo">
        Allerta Meteo Milano
    </div>

    <div class="sottotitolo">
        Protezione Civile Lombardia
    </div>

    <div id="contenuto">
        Caricamento dati...
    </div>

</div>

<script>

function coloreSemaforo(colore){

    if(!colore) return "#2e7d32";

    colore = colore.toLowerCase();

    if(colore === "rosso")
        return "#d32f2f";

    if(colore === "arancione")
        return "#ef6c00";

    if(colore === "giallo")
        return "#fbc02d";

    return "#2e7d32";
}

function formatDate(date){

    return date.toLocaleDateString("it-IT",{
        day:"2-digit",
        month:"2-digit"
    });

}

function salvaStorico(coloreOggi){

    const oggi = new Date().toISOString().substring(0,10);

    const record = {
        data: oggi,
        colore: coloreOggi
    };

    localStorage.setItem(
        "allerta_milano_oggi",
        JSON.stringify(record)
    );
}

function recuperaIeri(){

    try{

        const raw =
            localStorage.getItem("allerta_milano_oggi");

        if(!raw)
            return "verde";

        const obj = JSON.parse(raw);

        return obj.colore || "verde";

    }
    catch(e){

        return "verde";

    }

}

async function aggiorna(){

    try{

        const response =
            await fetch(
                "https://allertameteo.app/api/alert/Milano"
            );

        const json = await response.json();

        const d = json.data;

        const oggiColore =
            d.oggi.allerta.colore;

        const domaniColore =
            d.domani.allerta.colore;

        const ieriColore =
            recuperaIeri();

        salvaStorico(oggiColore);

        const ieriData = new Date();
        ieriData.setDate(ieriData.getDate()-1);

        document.getElementById("contenuto").innerHTML = `

        <div class="tabella">

            <div></div>

            <div class="header">
                ${formatDate(ieriData)}
            </div>

            <div class="header">
                ${d.bulletin_info.data_oggi}
            </div>

            <div class="header">
                ${d.bulletin_info.data_domani}
            </div>

            <div class="riga">
                🌊 Criticità Idraulica
            </div>

            <div class="cella"
                 style="background:${coloreSemaforo(ieriColore)}">
                 ${ieriColore}
            </div>

            <div class="cella"
                 style="background:${coloreSemaforo(oggiColore)}">
                 ${oggiColore}
            </div>

            <div class="cella"
                 style="background:${coloreSemaforo(domaniColore)}">
                 ${domaniColore}
            </div>

            <div class="riga">
                ⛰️ Criticità Idrogeologica
            </div>

            <div class="cella"
                 style="background:${coloreSemaforo(ieriColore)}">
                 ${ieriColore}
            </div>

            <div class="cella"
                 style="background:${coloreSemaforo(oggiColore)}">
                 ${oggiColore}
            </div>

            <div class="cella"
                 style="background:${coloreSemaforo(domaniColore)}">
                 ${domaniColore}
            </div>

            <div class="riga">
                ⛈️ Temporali Forti
            </div>

            <div class="cella"
                 style="background:${coloreSemaforo(ieriColore)}">
                 ${ieriColore}
            </div>

            <div class="cella"
                 style="background:${coloreSemaforo(oggiColore)}">
                 ${oggiColore}
            </div>

            <div class="cella"
                 style="background:${coloreSemaforo(domaniColore)}">
                 ${domaniColore}
            </div>

        </div>

        <div class="footer">

            Zona:
            ${d.zona}

            <div class="aggiornamento">

                Bollettino emesso il
                ${d.bulletin_info.data_bollettino}
                alle
                ${d.bulletin_info.ora_bollettino}

            </div>

            <div class="aggiornamento">

                Fonte:
                AllertaMeteo.app /
                Protezione Civile Lombardia

            </div>

        </div>

        `;

    }
    catch(err){

        document.getElementById("contenuto").innerHTML =
        "Errore nel caricamento del bollettino.";

    }

}

aggiorna();

setInterval(
    aggiorna,
    900000
);

</script>

</body>
</html>
